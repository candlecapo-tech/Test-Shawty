<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Night Garden</title>
  <meta name="description" content="Tap anywhere to grow glowing flowers under the stars." />
  <style>
    :root {
      --sky-top: #070b1f;
      --sky-bottom: #1a1440;
      --ground: #0b0d1c;
      --text: #f3eefe;
      --muted: #a9a2c9;
      --panel: rgba(20, 16, 48, 0.62);
      --border: rgba(255, 255, 255, 0.14);
      --accent: #ffd36e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--sky-top);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }
    header {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
    }
    .title h1 {
      margin: 0;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      text-shadow: 0 0 18px rgba(255, 211, 110, 0.45);
    }
    .title p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .stats {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 0.9rem;
      color: var(--muted);
      backdrop-filter: blur(6px);
      white-space: nowrap;
    }
    .stats b { color: var(--accent); font-variant-numeric: tabular-nums; }
    .controls {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      flex-wrap: nowrap;
      justify-content: center;
      max-width: calc(100% - 32px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px;
      backdrop-filter: blur(6px);
    }
    .controls button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.9rem;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .controls button:hover { background: rgba(255, 255, 255, 0.1); }
    .controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .controls button[aria-pressed="true"] { background: rgba(255, 211, 110, 0.2); color: var(--accent); }
    .hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--muted);
      font-size: 1.05rem;
      pointer-events: none;
      transition: opacity 0.8s;
      text-align: center;
      padding: 0 16px;
      animation: pulse 2.4s ease-in-out infinite;
    }
    .hint.hidden { opacity: 0; animation: none; }
    @keyframes pulse { 50% { opacity: 0.45; } }
    @media (prefers-reduced-motion: reduce) { .hint { animation: none; } }
    @media (max-width: 480px) {
      .controls { gap: 2px; padding: 4px; }
      .controls button { padding: 8px 10px; font-size: 0.85rem; white-space: nowrap; }
      .title p { font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <canvas id="garden" aria-label="Night garden. Click or tap to plant a glowing flower."></canvas>

  <header>
    <div class="title">
      <h1>Night Garden</h1>
      <p>Tap anywhere to plant a glowing flower.</p>
    </div>
    <div class="stats">Flowers <b id="count">0</b> · Fireflies <b id="flies">0</b></div>
  </header>

  <div class="hint" id="hint">✿ Click or tap the ground to begin ✿</div>

  <nav class="controls" aria-label="Garden controls">
    <button id="btn-sound" aria-pressed="true">🔔 Sound</button>
    <button id="btn-wind" aria-pressed="false">🌬️ Wind</button>
    <button id="btn-bloom">✨ Auto-bloom</button>
    <button id="btn-clear">🧹 Clear</button>
  </nav>

  <script>
  (() => {
    const canvas = document.getElementById('garden');
    const ctx = canvas.getContext('2d');
    const countEl = document.getElementById('count');
    const fliesEl = document.getElementById('flies');
    const hint = document.getElementById('hint');

    let W = 0, H = 0, DPR = 1, groundY = 0;
    const flowers = [];
    const fireflies = [];
    const sparks = [];
    let stars = [];
    let wind = false, windT = 0;
    let soundOn = true;
    let audio = null;
    let mouseX = -1;

    const rand = (a, b) => a + Math.random() * (b - a);
    const PALETTE = [
      [330, 95, 70], [280, 90, 75], [195, 95, 65], [45, 100, 65],
      [160, 80, 60], [10, 95, 68], [255, 90, 78]
    ];
    // Pentatonic scale for chimes (C major pentatonic, two octaves)
    const NOTES = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.51];

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * DPR;
      canvas.height = H * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      groundY = H * 0.78;
      stars = Array.from({ length: Math.round((W * H) / 3500) }, () => ({
        x: Math.random() * W,
        y: Math.random() * groundY * 0.95,
        r: Math.random() * 1.3 + 0.2,
        tw: Math.random() * Math.PI * 2,
        sp: rand(0.5, 2)
      }));
    }

    function chime(x) {
      if (!soundOn) return;
      try {
        if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
        if (audio.state === 'suspended') audio.resume();
        const idx = Math.max(0, Math.min(NOTES.length - 1, Math.floor((x / W) * NOTES.length)));
        const t = audio.currentTime;
        const osc = audio.createOscillator();
        const osc2 = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = 'sine';
        osc2.type = 'triangle';
        osc.frequency.value = NOTES[idx];
        osc2.frequency.value = NOTES[idx] * 2;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
        osc.connect(gain); osc2.connect(gain); gain.connect(audio.destination);
        osc.start(t); osc2.start(t);
        osc.stop(t + 1.7); osc2.stop(t + 1.7);
      } catch (e) { /* audio unavailable — stay silent */ }
    }

    function plant(x, y) {
      const baseY = Math.max(groundY + 4, Math.min(H - 8, y < groundY ? groundY + rand(4, 40) : y));
      const depth = (baseY - groundY) / (H - groundY); // 0 = far, 1 = near
      const scale = 0.6 + depth * 0.7;
      const color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
      const height = rand(60, Math.min(220, groundY * 0.55)) * scale;
      flowers.push({
        x, baseY, scale, color, height,
        grow: 0,
        bend: rand(-0.25, 0.25),
        petals: Math.floor(rand(5, 9)),
        petalLen: rand(12, 20) * scale,
        spin: rand(0, Math.PI * 2),
        phase: rand(0, Math.PI * 2),
        leaves: [rand(0.25, 0.45), rand(0.5, 0.7)]
      });
      flowers.sort((a, b) => a.baseY - b.baseY);
      for (let i = 0; i < 14; i++) {
        sparks.push({ x, y: baseY, vx: rand(-1.5, 1.5), vy: rand(-3, -0.5), life: 1, hue: color[0] });
      }
      if (flowers.length % 3 === 0) spawnFirefly(x, baseY - height);
      chime(x);
      hint.classList.add('hidden');
      updateStats();
    }

    function spawnFirefly(x, y) {
      if (fireflies.length > 60) return;
      fireflies.push({
        x, y, vx: rand(-0.4, 0.4), vy: rand(-0.4, 0.4),
        phase: rand(0, Math.PI * 2)
      });
    }

    function updateStats() {
      countEl.textContent = flowers.length;
      fliesEl.textContent = fireflies.length;
    }

    function drawSky(t) {
      const g = ctx.createLinearGradient(0, 0, 0, groundY);
      g.addColorStop(0, '#070b1f');
      g.addColorStop(1, '#2a1d5c');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // moon
      const mx = W * 0.82, my = H * 0.2, mr = Math.min(W, H) * 0.06;
      const mg = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 4);
      mg.addColorStop(0, 'rgba(255,240,200,0.35)');
      mg.addColorStop(1, 'rgba(255,240,200,0)');
      ctx.fillStyle = mg;
      ctx.fillRect(mx - mr * 4, my - mr * 4, mr * 8, mr * 8);
      ctx.fillStyle = '#fff5d8';
      ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(214,200,160,0.5)';
      [[-0.3, -0.25, 0.22], [0.35, 0.1, 0.16], [-0.05, 0.4, 0.12], [0.2, -0.45, 0.09]].forEach(([dx, dy, r]) => {
        ctx.beginPath(); ctx.arc(mx + dx * mr, my + dy * mr, r * mr, 0, Math.PI * 2); ctx.fill();
      });

      for (const s of stars) {
        const a = 0.4 + 0.6 * Math.abs(Math.sin(s.tw + t * 0.001 * s.sp));
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.fillRect(s.x, s.y, s.r, s.r);
      }
    }

    function drawGround() {
      const g = ctx.createLinearGradient(0, groundY, 0, H);
      g.addColorStop(0, '#16123a');
      g.addColorStop(1, '#05060f');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      for (let x = 0; x <= W; x += 20) {
        ctx.lineTo(x, groundY + Math.sin(x * 0.01) * 6 + Math.sin(x * 0.033) * 3);
      }
      ctx.lineTo(W, groundY + Math.sin(W * 0.01) * 6 + Math.sin(W * 0.033) * 3);
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
      ctx.fill();
    }

    function sway(f, t) {
      let s = Math.sin(t * 0.0012 + f.phase) * 0.05;
      if (wind) s += 0.22 + Math.sin(t * 0.004 + f.x * 0.01) * 0.12;
      if (mouseX >= 0) {
        const d = f.x - mouseX;
        if (Math.abs(d) < 80) s += (d / 80) * 0.15 * (1 - Math.abs(d) / 80) * 2;
      }
      return s;
    }

    function drawFlower(f, t) {
      f.grow = Math.min(1, f.grow + 0.012);
      const e = 1 - Math.pow(1 - f.grow, 3); // ease-out
      const h = f.height * e;
      const lean = f.bend + sway(f, t);
      const tipX = f.x + Math.sin(lean) * h;
      const tipY = f.baseY - Math.cos(lean) * h;
      const cx = f.x + Math.sin(lean * 0.5) * h * 0.5;
      const cy = f.baseY - h * 0.55;

      // stem
      ctx.strokeStyle = `hsla(140, 45%, ${28 + f.scale * 10}%, 1)`;
      ctx.lineWidth = 2.2 * f.scale;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(f.x, f.baseY);
      ctx.quadraticCurveTo(cx, cy, tipX, tipY);
      ctx.stroke();

      // leaves
      ctx.fillStyle = `hsla(140, 50%, ${30 + f.scale * 8}%, 1)`;
      f.leaves.forEach((p, i) => {
        if (e < p) return;
        const lx = f.x + (cx - f.x) * p * 1.6;
        const ly = f.baseY - h * p;
        const dir = i % 2 ? 1 : -1;
        const len = 14 * f.scale * Math.min(1, (e - p) * 4);
        ctx.save();
        ctx.translate(lx, ly);
        ctx.rotate(dir * 0.9 + lean);
        ctx.beginPath();
        ctx.ellipse(dir * len * 0.5, 0, len * 0.6, len * 0.22, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // bloom
      const bloom = Math.max(0, (e - 0.6) / 0.4);
      if (bloom <= 0) return;
      const [hue, sat, light] = f.color;
      const pulse = 0.85 + Math.sin(t * 0.002 + f.phase) * 0.15;
      const glowR = f.petalLen * 3.2 * bloom * pulse;
      const glow = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, glowR);
      glow.addColorStop(0, `hsla(${hue}, ${sat}%, ${light}%, 0.45)`);
      glow.addColorStop(1, `hsla(${hue}, ${sat}%, ${light}%, 0)`);
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(tipX, tipY, glowR, 0, Math.PI * 2); ctx.fill();

      ctx.save();
      ctx.translate(tipX, tipY);
      ctx.rotate(f.spin + t * 0.0002);
      const pl = f.petalLen * bloom;
      for (let i = 0; i < f.petals; i++) {
        ctx.rotate((Math.PI * 2) / f.petals);
        ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, 0.9)`;
        ctx.beginPath();
        ctx.ellipse(pl * 0.55, 0, pl * 0.55, pl * 0.24, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = `hsla(${(hue + 40) % 360}, 100%, 85%, 1)`;
      ctx.beginPath(); ctx.arc(0, 0, pl * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function drawFireflies(t) {
      for (const ff of fireflies) {
        ff.vx += rand(-0.05, 0.05) + (wind ? 0.02 : 0);
        ff.vy += rand(-0.05, 0.05);
        ff.vx *= 0.97; ff.vy *= 0.97;
        ff.x += ff.vx; ff.y += ff.vy;
        if (ff.x < 0) ff.x = W; if (ff.x > W) ff.x = 0;
        if (ff.y < H * 0.25) ff.vy += 0.05;
        if (ff.y > groundY) ff.vy -= 0.05;
        const a = 0.3 + 0.7 * Math.max(0, Math.sin(t * 0.003 + ff.phase));
        const g = ctx.createRadialGradient(ff.x, ff.y, 0, ff.x, ff.y, 10);
        g.addColorStop(0, `rgba(255, 240, 140, ${a})`);
        g.addColorStop(1, 'rgba(255, 240, 140, 0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(ff.x, ff.y, 10, 0, Math.PI * 2); ctx.fill();
      }
    }

    function drawSparks() {
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx; s.y += s.vy; s.vy += 0.06; s.life -= 0.02;
        if (s.life <= 0) { sparks.splice(i, 1); continue; }
        ctx.fillStyle = `hsla(${s.hue}, 100%, 75%, ${s.life})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, 2 * s.life, 0, Math.PI * 2); ctx.fill();
      }
    }

    function frame(t) {
      drawSky(t);
      drawGround();
      drawFireflies(t);
      for (const f of flowers) drawFlower(f, t);
      drawSparks();
      requestAnimationFrame(frame);
    }

    // Input
    canvas.addEventListener('pointerdown', (e) => plant(e.clientX, e.clientY));
    canvas.addEventListener('pointermove', (e) => { mouseX = e.clientX; });
    canvas.addEventListener('pointerleave', () => { mouseX = -1; });

    const btnSound = document.getElementById('btn-sound');
    btnSound.addEventListener('click', () => {
      soundOn = !soundOn;
      btnSound.setAttribute('aria-pressed', soundOn);
      btnSound.textContent = soundOn ? '🔔 Sound' : '🔕 Muted';
    });

    const btnWind = document.getElementById('btn-wind');
    btnWind.addEventListener('click', () => {
      wind = !wind;
      btnWind.setAttribute('aria-pressed', wind);
    });

    document.getElementById('btn-bloom').addEventListener('click', () => {
      for (let i = 0; i < 8; i++) {
        setTimeout(() => plant(rand(20, W - 20), rand(groundY + 6, H - 70)), i * 140);
      }
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      flowers.length = 0;
      fireflies.length = 0;
      sparks.length = 0;
      updateStats();
      hint.classList.remove('hidden');
    });

    window.addEventListener('resize', resize);
    resize();
    // A few fireflies to start
    for (let i = 0; i < 6; i++) spawnFirefly(rand(0, W), rand(H * 0.3, groundY));
    updateStats();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
